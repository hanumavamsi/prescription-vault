<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the app draw under the iPhone notch/home indicator; safe-area insets pad the content. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Health data: never let search engines index the app. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- PWA: installable from Chrome/Edge, and "Add to Home Screen" on iPhone opens it full screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rx Vault" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="rx-vault">
      html,
      body {
        background-color: #f2f2f7;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #000000;
        }
      }
      /* Visible keyboard focus ring in both themes; mouse/touch focus stays clean. */
      :focus:not(:focus-visible) {
        outline: none;
      }
      :focus-visible {
        outline: 2px solid #000000;
        outline-offset: 2px;
      }
      @media (prefers-color-scheme: dark) {
        :focus-visible {
          outline-color: #ffffff;
        }
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run Rx Vault. </noscript>
    <div id="root"></div>
  </body>
</html>
