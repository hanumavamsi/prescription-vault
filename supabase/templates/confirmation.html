<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to Rx Vault</title>
  </head>
  <body style="margin:0;padding:0;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#000000;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f2f7;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;padding:32px 24px;">
            <tr>
              <td style="font-size:17px;font-weight:600;padding-bottom:16px;">Rx Vault</td>
            </tr>
            <tr>
              <td style="font-size:17px;line-height:24px;padding-bottom:8px;">Your Rx Vault code is</td>
            </tr>
            <tr>
              <td style="font-size:40px;line-height:48px;font-weight:700;letter-spacing:8px;font-family:'SF Mono',Menlo,Consolas,monospace;padding-bottom:24px;">{{ .Token }}</td>
            </tr>
            <tr>
              <td style="font-size:15px;line-height:22px;color:#3c3c43;padding-bottom:16px;">
                Enter this code in Rx Vault to finish creating your account. It expires in 1 hour and can be used once.
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:18px;color:#8e8e93;">
                Didn't ask for this? You can ignore this email. Nobody can sign in without the code.
                Never share it with anyone.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
