# Web app CI/CD.
#   Pull request -> typecheck, lint, unit tests, database/API tests and browser tests, then a preview
#   deploy whose link is commented on the PR.
#   Push to master (a merged PR) -> the same checks, then build and deploy to production.
#   Nothing deploys unless every test passes.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   Secret   EXPO_TOKEN            Expo access token (expo.dev -> Account settings -> Access tokens)
#   Variables EXPO_PUBLIC_*        the values from .env.production (all public; they ship in the bundle)
#   Environment "production" secrets (Settings -> Environments -> production), for migrations:
#     SUPABASE_ACCESS_TOKEN  supabase.com/dashboard/account/tokens
#     SUPABASE_DB_PASSWORD   the database password (Project Settings -> Database)

name: Web

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch: # "Run workflow" button in the Actions tab

# A newer push to the same branch/PR cancels the older run. Production deploys are never cancelled
# mid-way; they queue instead.
concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generated by the Expo CLI and gitignored; tsc needs it for asset and CSS module types.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx tsc --noEmit
      - run: npx expo lint
      - name: Unit and component tests (Jest)
        run: npm test -- --ci

  test:
    name: Backend and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Local stack from supabase/config.toml + migrations; edge runtime serves delete-account,
      # Mailpit catches the sign-in emails the browser tests read.
      - run: supabase start -x studio,imgproxy,logflare,vector
      - name: Database tests (pgTAP)
        run: supabase test db
      - name: API tests (storage + delete-account)
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            node supabase/tests/e2e.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser tests (Playwright, production build)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Preview deploy' || 'Production deploy' }}
    needs: [check, test]
    # "production" only deploys from master
    # (repo Settings -> Environments; add a required reviewer there to gate deploys). Previews: no limits.
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    runs-on: ubuntu-latest
    # Forked PRs get no secrets, so they can't deploy; they still get the checks above.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write # to comment the preview link
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_INVITE_BASE_URL: ${{ vars.EXPO_PUBLIC_INVITE_BASE_URL }}
      EXPO_PUBLIC_PRIVACY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_URL }}
      EXPO_PUBLIC_TERMS_URL: ${{ vars.EXPO_PUBLIC_TERMS_URL }}
      EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
      EXPO_PUBLIC_OTP_LENGTH: ${{ vars.EXPO_PUBLIC_OTP_LENGTH }}
      EXPO_PUBLIC_GOOGLE_WEB_ENABLED: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_ENABLED }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fail early with a clear message instead of shipping a site that can't reach Supabase.
      - name: Check configuration
        run: |
          missing=0
          for v in EXPO_TOKEN EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set in the repo's Actions secrets/variables"; missing=1; fi
          done
          exit $missing

      # Production only: apply new migrations before the web app that needs them goes live.
      # Already-applied migrations are skipped, so this is a no-op when nothing changed.
      # Secrets live in the "production" environment, so only master can use them.
      - uses: supabase/setup-cli@v1
        if: github.event_name != 'pull_request'
        with:
          version: latest
      - name: Apply database migrations
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set in the production environment's secrets"; exit 1; fi
          done
          # Project ref is the subdomain of the Supabase URL (https://<ref>.supabase.co).
          ref=$(echo "$EXPO_PUBLIC_SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          supabase link --project-ref "$ref"
          supabase db push --remote

      - name: Build
        run: npx expo export --platform web

      - name: Deploy
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx eas-cli@latest deploy --non-interactive --json > deploy.json
          else
            npx eas-cli@latest deploy --prod --non-interactive --json > deploy.json
          fi
          url=$(node -e "const d=require('./deploy.json'); console.log(d.production?.url || d.aliases?.[0]?.url || d.url || '')")
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview link on the PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none \
            --body "Preview deploy for ${{ github.event.pull_request.head.sha }}: $URL"
